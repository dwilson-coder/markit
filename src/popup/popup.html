<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 320px;
      margin: 0;
      font-family: system-ui, sans-serif;
      padding: 12px;
      background: #1e1e1e;
      color: #eee;
    }
    h3 { margin: 0 0 10px; font-size: 14px; }
    .row { display: flex; gap: 6px; margin-bottom: 10px; }
    input[type="text"] {
      flex: 1;
      padding: 6px 8px;
      border: 1px solid #444;
      border-radius: 4px;
      background: #2a2a2a;
      color: #eee;
      font-size: 13px;
    }
    button {
      padding: 6px 10px;
      border: none;
      border-radius: 4px;
      background: #4a9eff;
      color: #fff;
      cursor: pointer;
      font-size: 12px;
    }
    button:hover { background: #3a8eef; }
    button:disabled { background: #555; cursor: default; }
    .controls { display: flex; gap: 6px; flex-wrap: wrap; }
    .controls button { flex: 1; min-width: 50px; }
    .color-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .color-row label { font-size: 12px; }
    input[type="color"] {
      width: 32px; height: 24px;
      border: none; cursor: pointer;
      background: none;
    }
    .count { font-size: 12px; color: #aaa; margin-bottom: 8px; }
    .copy-row { display: flex; gap: 6px; }
    .copy-row button { flex: 1; }
  </style>
</head>
<body>
  <h3>🔍 Text Search</h3>
  <div class="row">
    <input type="text" id="searchInput" placeholder="Search this page…" autofocus />
    <button id="searchBtn">Go</button>
  </div>
  <div class="count" id="countLabel">No search yet</div>
  <div class="controls">
    <button id="prevBtn" disabled>↑ Prev</button>
    <button id="nextBtn" disabled>↓ Next</button>
    <button id="clearBtn" disabled>✕ Clear</button>
  </div>
  <div class="color-row">
    <label for="colorPicker">Highlight:</label>
    <input type="color" id="colorPicker" value="#ffff00" />
  </div>
  <div class="copy-row">
    <button id="copyAllBtn" disabled>📋 Copy All Matches</button>
  </div>

  <script type="module" src="./popup.tsx"></script>
</body>
</html>
